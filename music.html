<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>Jarvis Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --surface: #0b0b0d;
    --raised: #131316;
    --line: #23232a;
    --ink: #f4f4f5;
    --ink-muted: #a1a1aa;
    --accent: #ff5c38;
    --row-h: 72px;
    --pad: 18px;
    --player-h: 168px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--surface);
    color: var(--ink);
    font-family: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }

  body {
    min-height: 100dvh;
    padding-bottom: calc(var(--player-h) + env(safe-area-inset-bottom, 0px));
    overflow-x: hidden;
  }

  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 var(--pad) 32px;
    /* Belt and braces: nothing in this page should ever widen the body. */
    overflow-x: clip;
  }

  header { padding: 32px 0 18px; }

  .wordmark {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }

  .wordmark h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: clamp(26px, 7vw, 36px);
    letter-spacing: -0.02em;
    margin: 0;
    line-height: 1.15;
  }

  .wordmark span {
    color: var(--ink-muted);
    font-size: 13px;
  }

  .search {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    /* On a wide screen a full-width field dwarfs the button beside it. */
    max-width: 620px;
  }

  .search input {
    flex: 1;
    min-width: 0;
    height: 46px;
    padding: 0 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--raised);
    color: var(--ink);
    font-family: inherit;
    font-size: 15px;
    outline: none;
  }

  .search input::placeholder { color: #6b6b74; }

  .search input:focus-visible {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255, 92, 56, 0.18);
  }

  .search button {
    height: 46px;
    padding: 0 20px;
    border-radius: 10px;
    border: 0;
    background: var(--accent);
    color: #1a0a05;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  .search button:focus-visible {
    outline: 3px solid rgba(255, 92, 56, 0.5);
    outline-offset: 2px;
  }

  .panes {
    display: grid;
    gap: 22px;
    margin-top: 24px;
  }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }

  .section-head h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-muted);
    margin: 0;
  }

  .section-head .count {
    font-size: 13px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }

  ul.tracks { list-style: none; margin: 0; padding: 0; }

  li.track {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: var(--row-h);
    padding: 13px 4px 13px 14px;
    border-bottom: 1px solid rgba(35, 35, 42, 0.6);
    cursor: pointer;
    /* Flex children must be allowed to shrink or a long title widens the row. */
    min-width: 0;
    overflow: hidden;
  }

  /* The marker is the selection state: the only thing telling you which
     row the player below is on. Not decoration. */
  li.track::before {
    content: "";
    position: absolute;
    left: 0;
    top: 50%;
    width: 3px;
    border-radius: 2px;
    background: transparent;
    transform: translateY(-50%);
    transition: height .18s ease, background-color .18s ease;
    height: 0;
  }

  li.track.active::before { height: 26px; background: var(--accent); }
  li.track:active { background: rgba(255, 255, 255, 0.03); }
  li.track:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .art {
    width: 44px;
    height: 44px;
    border-radius: 6px;
    background: #1c1c21;
    flex: 0 0 auto;
    object-fit: cover;
    display: block;
  }

  /* The shrinking half of the row. width:0 (not just min-width:0) is what makes
     flexbox actually honour the ellipsis on a long title in every engine. */
  .meta { width: 0; min-width: 0; flex: 1 1 auto; overflow: hidden; }

  .meta .title {
    font-family: "Fraunces", Georgia, serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.25;
    margin: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .meta .artist {
    font-size: 13px;
    color: var(--ink-muted);
    margin: 2px 0 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .time {
    font-size: 13px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
    flex: 0 0 auto;
  }

  .state {
    padding: 26px 4px;
    color: var(--ink-muted);
    font-size: 14px;
    line-height: 1.55;
  }

  .state strong { color: var(--ink); font-weight: 600; }

  .skeleton {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: var(--row-h);
    padding: 10px 4px 10px 14px;
    border-bottom: 1px solid rgba(35, 35, 42, 0.6);
    min-width: 0;
    overflow: hidden;
  }

  .skeleton .bar {
    background: #191920;
    border-radius: 4px;
    animation: breathe 1.4s ease-in-out infinite;
  }

  .skeleton .sq { width: 44px; height: 44px; border-radius: 6px; flex: 0 0 auto; }
  .skeleton .fill { flex: 1 1 auto; min-width: 0; display: grid; gap: 8px; }
  .skeleton .fill i { display: block; height: 10px; max-width: 100%; }
  .skeleton .fill .w1 { width: 62%; }
  .skeleton .fill .w2 { width: 38%; }

  @keyframes breathe {
    0%, 100% { opacity: .5; }
    50% { opacity: .9; }
  }

  .pager {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px 0 4px;
  }

  .pager button {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--raised);
    color: var(--ink);
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
  }

  .pager button:focus-visible {
    outline: 3px solid rgba(255, 92, 56, 0.5);
    outline-offset: 2px;
  }

  .pager button:disabled { opacity: .35; cursor: default; }

  .pager .pos {
    font-size: 13px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
    min-width: 44px;
    text-align: center;
  }

  .player {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    background: #0e0e11;
    border-top: 1px solid var(--line);
    padding: 11px var(--pad) calc(11px + env(safe-area-inset-bottom, 0px));
  }

  .player-inner {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .player-row {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    flex: 1 1 auto;
  }

  .art-lg {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    background: #1c1c21;
    object-fit: cover;
    flex: 0 0 auto;
  }

  .now { min-width: 0; flex: 1 1 auto; overflow: hidden; }

  .now .title {
    font-family: "Fraunces", Georgia, serif;
    font-size: 15px;
    font-weight: 500;
    margin: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .now .artist {
    font-size: 12.5px;
    color: var(--ink-muted);
    margin: 2px 0 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .bar-track {
    position: relative;
    height: 4px;
    border-radius: 2px;
    background: #26262e;
    margin: 9px 0 0;
    cursor: pointer;
  }

  .bar-track:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .bar-fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    border-radius: 2px;
    background: var(--accent);
  }

  .bar-times {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
    margin-top: 5px;
  }

  .transport {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
  }

  .transport button {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--raised);
    color: var(--ink);
    cursor: pointer;
    display: grid;
    place-items: center;
    font-size: 15px;
    line-height: 1;
  }

  .transport button:focus-visible {
    outline: 3px solid rgba(255, 92, 56, 0.5);
    outline-offset: 2px;
  }

  .transport button:disabled { opacity: .35; cursor: default; }

  .transport button.primary {
    width: 50px;
    height: 50px;
    background: var(--accent);
    border: 0;
    color: #1a0a05;
    font-size: 17px;
  }

  .notice {
    max-width: 1180px;
    margin: 9px auto 0;
    font-size: 12px;
    color: var(--ink-muted);
    line-height: 1.45;
  }

  .notice a { color: var(--accent); text-decoration: none; }
  .notice a:hover { text-decoration: underline; }

  /* Fallback embed. Shown only when a track has no playable preview,
     with the reason stated in .notice. */
  .embed-wrap {
    display: none;
    margin-top: 12px;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
    aspect-ratio: 16 / 9;
  }

  .embed-wrap.on { display: block; }
  .embed-wrap iframe, .embed-wrap #embed { width: 100%; height: 100%; border: 0; display: block; }

  /* Source switch. Two real options, nothing decorative. */
  .modes {
    display: flex;
    gap: 6px;
    margin-top: 12px;
  }

  .mode {
    flex: 1 1 0;
    min-width: 0;
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-muted);
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
  }

  .mode:hover { color: var(--ink); border-color: #3a3a44; }

  .mode.on {
    background: var(--raised);
    color: var(--ink);
    border-color: var(--accent);
    /* A 2px accent underline, not a fill: states the selection without
       shouting over the transport row above it. */
    box-shadow: inset 0 -2px 0 0 var(--accent);
  }

  .mode:focus-visible {
    outline: 3px solid rgba(255, 92, 56, 0.5);
    outline-offset: 2px;
  }

  @media (min-width: 700px) {
    .panes {
      grid-template-columns: minmax(0, 1fr) 360px;
      align-items: start;
    }

    .player {
      position: sticky;
      top: 18px;
      bottom: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
    }

    .player-inner { display: block; }

    .player-row { display: block; }

    .art-lg {
      width: 100%;
      height: auto;
      aspect-ratio: 1;
      border-radius: 10px;
      margin-bottom: 14px;
    }

    .transport { justify-content: center; margin-top: 14px; }

    body { padding-bottom: 32px; }
  }

  @media (max-width: 360px) {
    :root { --pad: 14px; }
    .transport button { width: 40px; height: 40px; }
    .transport button.primary { width: 46px; height: 46px; }
    .art-lg { width: 44px; height: 44px; }
  }
</style>
</head>
<body>

<div class="page">
  <header>
    <div class="wordmark">
      <h1>Jarvis Music</h1>
      <span>dari chat WhatsApp</span>
    </div>
    <div class="search">
      <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Cari lagu atau artis" aria-label="Cari lagu atau artis">
      <button id="go" type="button">Cari</button>
    </div>
  </header>

  <div class="panes">
    <section aria-labelledby="listhead">
      <div class="section-head">
        <h2 id="listhead">Daftar lagu</h2>
        <span class="count" id="count"></span>
      </div>
      <div id="list" role="list"></div>
      <div class="pager" id="pager" hidden>
        <button id="prev" type="button" aria-label="Halaman sebelumnya">&#8593;</button>
        <span class="pos" id="pos" aria-live="polite">1 / 1</span>
        <button id="next" type="button" aria-label="Halaman berikutnya">&#8595;</button>
      </div>
    </section>

    <section class="player" aria-labelledby="nowhead">
      <div class="player-inner">
        <div class="player-row">
          <img id="artLg" class="art-lg" alt="" width="52" height="52">
          <div class="now">
            <h2 id="nowhead" class="title">Belum ada lagu dipilih</h2>
            <p class="artist" id="artist">Pilih baris di daftar untuk memutar</p>
            <div class="bar-track" id="barTrack" role="slider" tabindex="0"
                 aria-label="Posisi lagu" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="bar-fill" id="barFill"></div>
            </div>
            <div class="bar-times">
              <span id="tCur">0:00</span>
              <span id="tDur">0:00</span>
            </div>
          </div>
        </div>
        <div class="transport">
          <button id="back" type="button" aria-label="Mundur 10 detik" disabled>&#8630;</button>
          <button id="play" class="primary" type="button" aria-label="Putar" disabled>&#9654;</button>
          <button id="fwd" type="button" aria-label="Maju 10 detik" disabled>&#8631;</button>
        </div>
      </div>
      <p class="notice" id="notice"></p>
      <div class="modes">
        <button id="modeFull" class="mode on" type="button" aria-pressed="true">Lagu penuh</button>
        <button id="modeClip" class="mode" type="button" aria-pressed="false">Cuplikan 30 detik</button>
      </div>
      <div class="embed-wrap" id="embedWrap">
        <div id="embed" title="Pemutar lagu penuh"></div>
      </div>
    </section>
  </div>
</div>

<audio id="audio" preload="none" crossorigin="anonymous"></audio>

<script>
(function () {
  'use strict';

  var PAGE_SIZE = 6;
  var ITUNES = 'https://itunes.apple.com/search';

  var qEl = document.getElementById('q');
  var goEl = document.getElementById('go');
  var listEl = document.getElementById('list');
  var countEl = document.getElementById('count');
  var pagerEl = document.getElementById('pager');
  var prevEl = document.getElementById('prev');
  var nextEl = document.getElementById('next');
  var posEl = document.getElementById('pos');

  var audio = document.getElementById('audio');
  var artLg = document.getElementById('artLg');
  var titleEl = document.getElementById('nowhead');
  var artistEl = document.getElementById('artist');
  var playBtn = document.getElementById('play');
  var backBtn = document.getElementById('back');
  var fwdBtn = document.getElementById('fwd');
  var barTrack = document.getElementById('barTrack');
  var barFill = document.getElementById('barFill');
  var tCur = document.getElementById('tCur');
  var tDur = document.getElementById('tDur');
  var noticeEl = document.getElementById('notice');
  var embedWrap = document.getElementById('embedWrap');
  var embedEl = document.getElementById('embed');
  var modeFull = document.getElementById('modeFull');
  var modeClip = document.getElementById('modeClip');

  var tracks = [];
  var page = 1;
  var selectedKey = null;
  // 'full' plays the whole song through the YouTube player; 'clip' plays the
  // 30 s iTunes preview in the plain <audio> element. Full is the default
  // because a 30 s sample is not what anyone came here for.
  var mode = 'full';
  var ytPlayer = null;
  var ytReady = false;
  var ytApiRequested = false;

  var params = new URLSearchParams(location.search);
  var initialQuery = (params.get('q') || '').trim();
  // The bot resolves exactly one id for the song the user asked for. That row
  // gets real full-song playback; the rest of the list is a starting point.
  var initialVideoId = (params.get('v') || '').replace(/[^A-Za-z0-9_-]/g, '');

  /* Attach the bot's video id to the best-matching row after the list loads.
     Title match first, then artist, so the id never lands on a wrong song. */
  function applyInitialVideoId() {
    if (!initialVideoId || !tracks.length) return;
    var q = initialQuery.toLowerCase();
    var best = null;
    var bestScore = 0;
    tracks.forEach(function (t) {
      var hay = (t.title + ' ' + t.artist).toLowerCase();
      var score = 0;
      if (hay.indexOf(q) !== -1 && q) score += 2;
      // Word overlap as a cheap similarity, no dependency needed.
      q.split(/\s+/).forEach(function (w) {
        if (w.length > 2 && hay.indexOf(w) !== -1) score += 1;
      });
      if (score > bestScore) { bestScore = score; best = t; }
    });
    if (best) best.videoId = initialVideoId;
  }

  function fmt(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* Loading state keeps the real row height so the list never jumps. */
  function renderSkeleton() {
    listEl.innerHTML = '';
    countEl.textContent = '';
    pagerEl.hidden = true;
    for (var i = 0; i < 4; i++) {
      var row = document.createElement('div');
      row.className = 'skeleton';
      // Widths live in CSS classes, not inline styles: an inline % on a flex
      // child is what let a stale skeleton row widen the page.
      row.innerHTML =
        '<div class="bar sq"></div>' +
        '<div class="fill"><i class="bar w1"></i><i class="bar w2"></i></div>';
      listEl.appendChild(row);
    }
  }

  function renderState(html) {
    listEl.innerHTML = '<div class="state">' + html + '</div>';
    countEl.textContent = '';
    pagerEl.hidden = true;
  }

  function renderList() {
    listEl.innerHTML = '';
    countEl.textContent = tracks.length + ' lagu';

    var pages = Math.max(1, Math.ceil(tracks.length / PAGE_SIZE));
    if (page > pages) page = pages;
    posEl.textContent = page + ' / ' + pages;
    pagerEl.hidden = tracks.length <= PAGE_SIZE;
    prevEl.disabled = page <= 1;
    nextEl.disabled = page >= pages;

    var start = (page - 1) * PAGE_SIZE;

    tracks.slice(start, start + PAGE_SIZE).forEach(function (t) {
      var li = document.createElement('li');
      li.className = 'track' + (t.key === selectedKey ? ' active' : '');
      li.setAttribute('role', 'listitem');
      li.tabIndex = 0;
      li.dataset.key = t.key;

      var art = document.createElement('img');
      art.className = 'art';
      art.alt = '';
      art.width = 44;
      art.height = 44;
      art.loading = 'lazy';
      art.src = t.art ? t.art.replace('100x100', '200x200') : '';
      if (!art.src) art.style.visibility = 'hidden';

      var meta = document.createElement('div');
      meta.className = 'meta';
      var h = document.createElement('p');
      h.className = 'title';
      h.textContent = t.title;
      var a = document.createElement('p');
      a.className = 'artist';
      a.textContent = t.artist;
      meta.appendChild(h);
      meta.appendChild(a);

      var time = document.createElement('span');
      time.className = 'time';
      time.textContent = typeof t.seconds === 'number' ? fmt(t.seconds) : '';

      li.appendChild(art);
      li.appendChild(meta);
      li.appendChild(time);

      li.addEventListener('click', function () { select(t); });
      li.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(t); }
      });

      listEl.appendChild(li);
    });
  }

  function setEnabled(on) {
    playBtn.disabled = !on;
    backBtn.disabled = !on;
    fwdBtn.disabled = !on;
    barTrack.setAttribute('aria-disabled', on ? 'false' : 'true');
  }

  function setMode(next) {
    mode = next;
    var full = next === 'full';
    modeFull.classList.toggle('on', full);
    modeClip.classList.toggle('on', !full);
    modeFull.setAttribute('aria-pressed', full ? 'true' : 'false');
    modeClip.setAttribute('aria-pressed', full ? 'false' : 'true');
    var cur = tracks.filter(function (t) { return t.key === selectedKey; })[0];
    if (cur) select(cur);
  }

  function select(t) {
    selectedKey = t.key;

    document.querySelectorAll('li.track').forEach(function (el) {
      el.classList.toggle('active', el.dataset.key === t.key);
    });

    titleEl.textContent = t.title;
    artistEl.textContent = t.artist;
    artLg.src = t.art ? t.art.replace('100x100', '300x300') : '';
    artLg.alt = t.art ? ('Sampul ' + t.title) : '';

    // Stop whichever source was running before switching.
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
    if (ytPlayer && ytPlayer.stopVideo) { try { ytPlayer.stopVideo(); } catch (e) {} }
    embedWrap.classList.remove('on');

    if (mode === 'clip') {
      selectClip(t);
    } else {
      selectFull(t);
    }
  }

  /* Full song. The YouTube IFrame player is the only source that can legally
     and reliably serve a whole track from a static page: it is served by
     YouTube itself, so there is no CORS wall and no server in the middle.
     The bot resolves one video id per link; rows without one fall back to the
     clip, with a YouTube search link beside it. */
  function selectFull(t) {
    var videoId = t.videoId;
    if (!videoId) {
      noticeEl.innerHTML = 'Lagu ini belum punya padanan video, jadi diputar sebagai cuplikan. ' +
        '<a href="https://www.youtube.com/results?search_query=' +
        encodeURIComponent(t.title + ' ' + t.artist) + '" target="_blank" rel="noopener">Cari di YouTube</a>';
      selectClip(t);
      return;
    }

    noticeEl.textContent = 'Lagu penuh diputar lewat pemutar YouTube resmi.';
    // Reveal the box first, then build the player into it: YouTube has to see
    // a non-zero frame or it mounts a black rectangle.
    embedWrap.classList.add('on');
    setEnabled(true);
    barFill.style.width = '0%';
    tCur.textContent = '0:00';
    tDur.textContent = typeof t.seconds === 'number' ? fmt(t.seconds) : '0:00';

    if (ytReady && ytPlayer && ytPlayer.loadVideoById) {
      ytPlayer.loadVideoById(videoId);
      return;
    }
    // Player not built yet. Stash the id and get the API moving; the ready
    // handler will start it once the frame has real dimensions.
    pendingVideoId = videoId;
    ensureYouTubeApi();
  }

  function selectClip(t) {
    if (!t.preview) {
      noticeEl.innerHTML = 'Cuplikan tidak tersedia. ' +
        '<a href="https://www.youtube.com/results?search_query=' +
        encodeURIComponent(t.title + ' ' + t.artist) + '" target="_blank" rel="noopener">Cari di YouTube</a>';
      setEnabled(false);
      return;
    }
    noticeEl.textContent = 'Cuplikan resmi 30 detik dari iTunes.';
    audio.src = t.preview;
    setEnabled(true);
    var p = audio.play();
    if (p && typeof p.catch === 'function') {
      p.catch(function (err) {
        // Autoplay is blocked until the page has had one real user gesture.
        // Say what to do, not what the browser called the error.
        noticeEl.textContent = (err && err.name === 'NotAllowedError')
          ? 'Tap tombol putar untuk mulai.'
          : 'Cuplikan tidak bisa diputar. Coba lagu lain.';
      });
    }
  }

  function search(query) {
    renderSkeleton();
    var term = query || 'top hits 2026';
    fetch(ITUNES + '?term=' + encodeURIComponent(term) + '&entity=song&limit=24&media=music')
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        var rows = (data && data.results) || [];
        tracks = rows
          .filter(function (r) { return r.trackName; })
          .map(function (r, i) {
            return {
              key: (r.trackId || i) + ':' + (r.trackName || ''),
              title: r.trackName || 'Tanpa judul',
              artist: r.artistName || 'Artis tidak diketahui',
              art: r.artworkUrl100 || '',
              preview: r.previewUrl || '',
              seconds: r.trackTimeMillis ? Math.round(r.trackTimeMillis / 1000) : undefined
            };
          });

        if (!tracks.length) {
          renderState('<strong>Tidak ada hasil untuk "' + escapeHtml(query) + '".</strong><br>Coba kata kunci lain, atau nama artisnya saja.');
          return;
        }

        // The one id the bot resolved wins for the song it named; every other
        // row is played by handing YouTube the search, which keeps the page
        // backend-free.
        applyInitialVideoId();

        page = 1;
        selectedKey = null;
        renderList();
        var first = tracks.filter(function (t) { return t.videoId; })[0] || tracks[0];
        select(first);
      })
      .catch(function (err) {
        tracks = [];
        renderState('<strong>Koneksi ke server pencarian gagal.</strong><br>Coba cari ulang. Kalau masih gagal, periksa koneksi internet. (' + escapeHtml(err.message || 'error') + ')');
      });
  }

  // ── YouTube IFrame player ───────────────────────────────────────────────
  // Serves the whole song. It has to be the real iframe API (not a plain
  // <iframe src>) because only the API gives us progress, play/pause and seek,
  // which the transport row and the progress bar are wired to.
  var pendingVideoId = null;

  window.onYouTubeIframeAPIReady = function () {
    if (ytPlayer) return;
    ytReady = true;
    // Pass the id at construction when we already have it. loadVideoById on a
    // player that has not finished mounting is a no-op, which is why the frame
    // used to come up with an empty src.
    var opts = {
      width: '100%',
      height: '100%',
      playerVars: { rel: '0', playsinline: 1 },
      events: {
        onReady: function () {
          if (pendingVideoId) { ytPlayer.loadVideoById(pendingVideoId); pendingVideoId = null; }
        },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.PLAYING) {
            playBtn.innerHTML = '&#10073;&#10073;';
            playBtn.setAttribute('aria-label', 'Jeda');
          } else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) {
            playBtn.innerHTML = '&#9654;';
            playBtn.setAttribute('aria-label', 'Putar');
          }
        },
        onError: function () {
          // 101/150 = uploader forbids embedding. Say so and hand over a link
          // instead of leaving a dead black box.
          var cur = tracks.filter(function (x) { return x.key === selectedKey; })[0];
          var vid = (cur && cur.videoId) || pendingVideoId || '';
          noticeEl.innerHTML = 'Video ini tidak mengizinkan pemutaran di halaman lain. ' +
            (vid ? '<a href="https://www.youtube.com/watch?v=' + encodeURIComponent(vid) +
              '" target="_blank" rel="noopener">Buka di YouTube</a>. ' : '') +
            'Mencoba cuplikan 30 detik.';
          if (cur && cur.preview) selectClip(cur);
        }
      }
    };
    // Seed the id at construction so the first frame comes up already loaded.
    if (pendingVideoId) { opts.videoId = pendingVideoId; pendingVideoId = null; }
    ytPlayer = new YT.Player('embed', opts);
  };

  // The player's own clock drives the bar while it is the active source.
  setInterval(function () {
    if (mode !== 'full' || !ytPlayer || !ytPlayer.getCurrentTime) return;
    var d = ytPlayer.getDuration ? ytPlayer.getDuration() : 0;
    var c = ytPlayer.getCurrentTime() || 0;
    if (d > 0) {
      barFill.style.width = (c / d * 100).toFixed(2) + '%';
      barTrack.setAttribute('aria-valuenow', Math.round(c / d * 100));
      tDur.textContent = fmt(d);
    }
    tCur.textContent = fmt(c);
  }, 500);

  function paintProgress() {
    var d = audio.duration;
    var c = audio.currentTime;
    if (isFinite(d) && d > 0) {
      barFill.style.width = (c / d * 100).toFixed(2) + '%';
      barTrack.setAttribute('aria-valuenow', Math.round(c / d * 100));
      tDur.textContent = fmt(d);
    } else {
      barFill.style.width = '0%';
      barTrack.setAttribute('aria-valuenow', 0);
    }
    tCur.textContent = fmt(c);
  }

  goEl.addEventListener('click', function () { search(qEl.value.trim()); });

  qEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); search(qEl.value.trim()); }
  });

  prevEl.addEventListener('click', function () { if (page > 1) { page--; renderList(); } });
  nextEl.addEventListener('click', function () {
    if (page < Math.ceil(tracks.length / PAGE_SIZE)) { page++; renderList(); }
  });

  playBtn.addEventListener('click', function () {
    if (mode === 'full') {
      if (!ytPlayer || !ytPlayer.getPlayerState) return;
      if (ytPlayer.getPlayerState() === 1) ytPlayer.pauseVideo();
      else ytPlayer.playVideo();
      return;
    }
    if (!audio.src) return;
    if (audio.paused) { audio.play().catch(function () {}); }
    else { audio.pause(); }
  });

  backBtn.addEventListener('click', function () {
    if (mode === 'full') {
      if (!ytPlayer || !ytPlayer.getCurrentTime) return;
      ytPlayer.seekTo(Math.max(0, ytPlayer.getCurrentTime() - 10), true);
      return;
    }
    if (!audio.src) return;
    audio.currentTime = Math.max(0, audio.currentTime - 10);
  });

  fwdBtn.addEventListener('click', function () {
    if (mode === 'full') {
      if (!ytPlayer || !ytPlayer.getCurrentTime) return;
      var dur = ytPlayer.getDuration ? ytPlayer.getDuration() : 0;
      ytPlayer.seekTo(Math.min(dur, ytPlayer.getCurrentTime() + 10), true);
      return;
    }
    if (!audio.src || !isFinite(audio.duration)) return;
    audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
  });

  function seekFromEvent(e) {
    var rect = barTrack.getBoundingClientRect();
    var x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    var ratio = Math.min(1, Math.max(0, x / rect.width));
    if (mode === 'full') {
      if (!ytPlayer || !ytPlayer.getDuration) return;
      var d = ytPlayer.getDuration();
      if (d > 0) ytPlayer.seekTo(ratio * d, true);
      return;
    }
    if (!audio.src || !isFinite(audio.duration) || audio.duration <= 0) return;
    audio.currentTime = ratio * audio.duration;
  }

  barTrack.addEventListener('click', seekFromEvent);
  barTrack.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    e.preventDefault();
    var delta = e.key === 'ArrowRight' ? 5 : -5;
    if (mode === 'full') {
      if (!ytPlayer || !ytPlayer.getCurrentTime) return;
      ytPlayer.seekTo(Math.max(0, ytPlayer.getCurrentTime() + delta), true);
      return;
    }
    if (!audio.src || !isFinite(audio.duration)) return;
    audio.currentTime = Math.min(audio.duration, Math.max(0, audio.currentTime + delta));
  });

  modeFull.addEventListener('click', function () { setMode('full'); });
  modeClip.addEventListener('click', function () { setMode('clip'); });

  audio.addEventListener('timeupdate', paintProgress);
  audio.addEventListener('loadedmetadata', paintProgress);
  audio.addEventListener('play', function () {
    playBtn.innerHTML = '&#10073;&#10073;';
    playBtn.setAttribute('aria-label', 'Jeda');
  });
  audio.addEventListener('pause', function () {
    playBtn.innerHTML = '&#9654;';
    playBtn.setAttribute('aria-label', 'Putar');
  });
  audio.addEventListener('ended', function () { barFill.style.width = '100%'; });
  audio.addEventListener('error', function () {
    if (!audio.src) return;
    noticeEl.textContent = 'Cuplikan gagal dimuat. Coba pilih lagu lain atau pencarian ulang.';
  });

  /* Load the YouTube API from our own code, after the ready handler exists.
     A plain <script src> in the head fires onYouTubeIframeAPIReady before the
     handler is defined on a fast connection, and the callback is lost: that is
     what left the black, empty player box. */
  function ensureYouTubeApi() {
    if (ytApiRequested) return;
    ytApiRequested = true;
    if (window.YT && window.YT.Player) { window.onYouTubeIframeAPIReady(); return; }
    var s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.async = true;
    s.onerror = function () {
      noticeEl.innerHTML = 'Pemutar YouTube gagal dimuat. ' +
        '<a href="https://www.youtube.com/results?search_query=' +
        encodeURIComponent(initialQuery || '') + '" target="_blank" rel="noopener">Cari di YouTube</a>.';
    };
    document.head.appendChild(s);
    // The API calls onYouTubeIframeAPIReady when it lands; nothing else to do.
  }

  // Init. The query arrives from the WhatsApp link, so the first search runs
  // without the user touching anything.
  if (initialQuery) {
    qEl.value = initialQuery;
    search(initialQuery);
  } else {
    qEl.focus();
    renderState('<strong>Belum ada lagu dimuat.</strong><br>Cari di kolom atas untuk mulai.');
  }
})();
</script>
</body>
</html>
